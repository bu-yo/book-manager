<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="藏书管家：家庭藏书录入、分类、统计与导出。">
<title>藏书管家 · 家庭藏书管理</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
<script>
/* 运行期错误采集：便于离线排查，也方便自动化检测 */
window.__dshErrors = [];
window.addEventListener('error', function (e) {
  window.__dshErrors.push((e.message || 'error') + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  document.documentElement.setAttribute('data-js-errors', window.__dshErrors.join(' || '));
});
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">藏</div>
      <div class="brand-text">
        <strong>藏书管家</strong>
        <span id="brand-sub">本地藏书管理</span>
      </div>
    </div>

    <button class="btn btn-primary btn-block" data-action="new-book">
      <span class="plus">+</span> 录入新书
    </button>

    <nav class="nav" id="nav">
      <a href="#/overview" data-route="overview"><i class="ico">◔</i>总览</a>
      <a href="#/books" data-route="books"><i class="ico">☰</i>书目</a>
      <a href="#/shelf" data-route="shelf"><i class="ico">▥</i>书架</a>
      <a href="#/categories" data-route="categories"><i class="ico">▤</i>分类</a>
      <a href="#/dict" data-route="dict"><i class="ico">⌗</i>分类词典</a>
      <a href="#/data" data-route="data"><i class="ico">⇅</i>数据与备份</a>
    </nav>

    <div class="side-foot">
      <div class="side-stat"><span>藏书</span><b id="side-titles">0</b></div>
      <div class="side-stat"><span>册数</span><b id="side-copies">0</b></div>
      <div class="side-note" id="side-note">数据保存在本机浏览器</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" data-action="toggle-nav" aria-label="菜单">☰</button>
      <div class="search">
        <span class="search-ico">⌕</span>
        <input id="search" type="search" placeholder="搜索书名、作者、出版社、标签…" autocomplete="off">
        <kbd class="only-desktop">/</kbd>
      </div>
      <div class="top-actions">
        <button class="btn btn-soft" data-action="export-xlsx">导出 Excel</button>
      </div>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>

<div id="modal-root" class="modal-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<!-- 手机端底部导航：保留桌面端侧边栏，手机端切换为 App 式导航 -->
<nav class="mobile-bottom-nav" aria-label="手机导航">
  <a href="#/overview" data-mobile-route="overview"><span class="mobile-nav-ico">⌂</span><span>首页</span></a>
  <a href="#/shelf" data-mobile-route="shelf"><span class="mobile-nav-ico">▥</span><span>书架</span></a>
  <button class="mobile-add" data-action="new-book" aria-label="录入新书"><span>＋</span></button>
  <a href="#/categories" data-mobile-route="categories"><span class="mobile-nav-ico">▤</span><span>分类</span></a>
  <a href="#/data" data-mobile-route="data"><span class="mobile-nav-ico">⋯</span><span>我的</span></a>
</nav>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
